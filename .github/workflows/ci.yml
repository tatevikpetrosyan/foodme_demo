name: CI

on:
  pull_request: 
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button

jobs:
  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:e2e
      