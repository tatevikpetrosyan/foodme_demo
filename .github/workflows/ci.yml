name: CI                        

on:                              
  pull_request:                  
    branches: [main]           

jobs:                            

 e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_API_BASE_URL: http://localhost:8081

    # Database for the backend (db / user / password: foodme)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Backend on localhost:8081
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Start backend
        working-directory: apps/backend
        run: |
          ./gradlew bootJar -x test
          nohup java -jar $(ls build/libs/*.jar | grep -v plain) > backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health && exit 0
            sleep 2
          done
          cat ../backend/backend.log; exit 1

      # Web e2e tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Skip the /backoffice test: the admin app is only served by the Docker/Render build
      - run: npx playwright test --grep-invert "admin can login and list orders after a storefront checkout"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-log
          path: apps/backend/backend.log
